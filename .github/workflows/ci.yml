name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentinelpay-ui/package-lock.json

      - name: Build UI
        working-directory: sentinelpay-ui
        run: |
          npm ci
          npm run build

      - name: Detect Python services
        id: python-services
        shell: bash
        run: |
          if find microservices -type f \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" \) | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Python tests
        id: python-tests
        if: steps.python-services.outputs.exists == 'true'
        shell: bash
        run: |
          if find microservices -type f \( -path "*/tests/*.py" -o -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python-services.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            microservices/**/requirements.txt

      - name: Install Python dependencies
        if: steps.python-services.outputs.exists == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          while IFS= read -r requirements_file; do
            pip install -r "$requirements_file"
          done < <(find microservices -type f -name "requirements.txt" | sort)
          pip install pytest

      - name: Run Python tests with pytest
        if: steps.python-tests.outputs.exists == 'true'
        run: pytest microservices

      - name: Byte-compile Python services
        if: steps.python-services.outputs.exists == 'true'
        run: python -m compileall microservices/ml-services/fraud-ml-service/inference microservices/ml-services/fraud-ml-service/training

      - name: Build Docker images
        shell: bash
        run: |
          for dockerfile in microservices/*/Dockerfile; do
            service="$(basename "$(dirname "$dockerfile")")"
            image="sentinelpay-${service}:ci"
            docker build -f "$dockerfile" -t "$image" .
          done

      - name: Run Compose Go stack smoke tests
        shell: bash
        run: |
          docker compose -f docker-compose.yml up -d --build
          ./scripts/smoke-go-stack.sh
          ./scripts/smoke-service-communication.sh
          ./scripts/validate-go-migrations.sh

      - name: Dump Compose diagnostics on smoke failure
        if: failure()
        shell: bash
        run: |
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=200

      - name: Stop Compose stack
        if: always()
        shell: bash
        run: docker compose -f docker-compose.yml down -v --remove-orphans

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker images
        if: github.event_name == 'push'
        shell: bash
        run: |
          for dockerfile in microservices/*/Dockerfile; do
            service="$(basename "$(dirname "$dockerfile")")"
            image="${{ secrets.DOCKER_USERNAME }}/sentinelpay-${service}:latest"
            docker build -f "$dockerfile" -t "$image" .
            docker push "$image"
          done
