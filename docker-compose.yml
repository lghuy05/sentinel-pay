version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelpay
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  account-service:
    image: iyuyui/sentinelpay-account-service:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18080:8087"

  alert-service:
    image: iyuyui/sentinelpay-alert-service:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8087
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18081:8086"

  api-gateway:
    image: iyuyui/sentinelpay-api-gateway:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18082:8080"

  blacklist-service:
    image: iyuyui/sentinelpay-blacklist-service:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18083:8084"

  feature-extractor:
    image: iyuyui/sentinelpay-feature-extractor:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8087
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18084:8082"

  fraud-orchestrator:
    image: iyuyui/sentinelpay-fraud-orchestrator:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_SERVICE_URL: http://ml-service:5000
      SERVICES_INGESTOR_URL: http://transaction-ingestor:8081/health/transaction-ingestor
      SERVICES_EXTRACTOR_URL: http://feature-extractor:8082/health/feature-extractor
      SERVICES_BLACKLIST_URL: http://blacklist-service:8084/health/blacklist-service
      SERVICES_RULE_URL: http://rule-engine:8083/health/rule-engine
      SERVICES_ML_URL: http://ml-service:5000/health/ml-service
      SERVICES_ORCHESTRATOR_URL: http://fraud-orchestrator:8085/actuator/health
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18085:8085"

  rule-engine:
    image: iyuyui/sentinelpay-rule-engine:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18086:8083"

  transaction-ingestor:
    image: iyuyui/sentinelpay-transaction-ingestor:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "18087:8081"

  ml-service:
    image: iyuyui/sentinelpay-ml-service:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinelpay
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HEALTH_PORT: 5000
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "5000:5000"

volumes:
  postgres_data:
