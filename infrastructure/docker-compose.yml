version: '3.8'
services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sentinelpay
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
    ports: ["15432:5432"]  
    # volumes: [postgres_data:/var/lib/postgresql/data]
    volumes: 
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Cache
  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]  

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["22181:2181"]  

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports: ["19092:19092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 16
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      set -eu;
      set -o pipefail;
      BOOTSTRAP="$${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}";
      PARTITIONS="$${KAFKA_PARTITIONS:-16}";
      REPLICATION="$${KAFKA_REPLICATION_FACTOR:-1}";
      for _ in $$(seq 1 60); do
        if kafka-topics --bootstrap-server "$$BOOTSTRAP" --list >/dev/null 2>&1; then break; fi;
        sleep 2;
      done;
      for topic in transactions.raw transactions.enriched fraud.blacklist fraud.rules fraud.ml fraud.final transactions.raw.DLT transactions.enriched.DLT fraud.blacklist.DLT fraud.rules.DLT fraud.ml.DLT fraud.final.DLT; do
        kafka-topics --bootstrap-server "$$BOOTSTRAP" --create --if-not-exists --topic "$$topic" --partitions "$$PARTITIONS" --replication-factor "$$REPLICATION" >/dev/null;
      done
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PARTITIONS: 16
      KAFKA_REPLICATION_FACTOR: 1

  fraud-ml-service:
    build:
      context: ../microservices/ml-services/fraud-ml-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    ports: ["18091:8091"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC: fraud.rules
      OUTPUT_TOPIC: fraud.ml
      KAFKA_GROUP_ID: fraud-ml-service
      MODEL_VERSION: logreg-synthetic-v3
      HEALTH_PORT: 8091
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: orchestrator_db
      DB_USER: sentinel
      DB_PASSWORD: sentinel123
    restart: unless-stopped

volumes:
  postgres_data:
