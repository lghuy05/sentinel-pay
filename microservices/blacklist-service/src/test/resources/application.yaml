spring:
  datasource:
    url: jdbc:h2:mem:blacklist_service_db;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    listener:
      auto-startup: false
  data:
    redis:
      host: localhost
      port: 16379

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
