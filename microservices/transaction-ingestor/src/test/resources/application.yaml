spring:
  datasource:
    url: jdbc:h2:mem:transaction_ingestor_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    listener:
      auto-startup: false

event:
  publisher: noop

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
